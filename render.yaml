services:
  - type: web
    name: questlearn
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix frontend --include=dev && npm ci --prefix backend --include=dev && npm --prefix backend run prisma:generate && npm --prefix frontend run build
    startCommand: npm --prefix backend run prisma:deploy && npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: questlearn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12

databases:
  - name: questlearn-db
    plan: free
    region: singapore
    databaseName: questlearn
    user: questlearn
    ipAllowList: []
